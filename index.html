<!DOCTYPE html>
<html>
<head>
    <title>My WebOS</title>
        <style>
                /* --- GLOBAL STYLES --- */
                        body {
                                    background-color: #2b2b2b; /* Default dark mode */
                                                font-family: sans-serif;
                                                            margin: 0;
                                                                        height: 100vh;
                                                                                    overflow: hidden; 
                                                                                                transition: background-color 0.3s;
                                                                                                        }

                                                                                                                /* --- TOP BAR --- */
                                                                                                                        .top-bar {
                                                                                                                                    position: absolute;
                                                                                                                                                top: 0; left: 0; width: 100%;
                                                                                                                                                            background-color: rgba(0, 0, 0, 0.6);
                                                                                                                                                                        color: white;
                                                                                                                                                                                    display: flex; justify-content: space-between;
                                                                                                                                                                                                padding: 10px 20px; box-sizing: border-box;
                                                                                                                                                                                                            backdrop-filter: blur(5px);
                                                                                                                                                                                                                        z-index: 10;
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                        /* --- DESKTOP ICONS --- */
                                                                                                                                                                                                                                                .desktop-icon {
                                                                                                                                                                                                                                                            position: absolute;
                                                                                                                                                                                                                                                                        display: flex; flex-direction: column;
                                                                                                                                                                                                                                                                                    align-items: center; color: white;
                                                                                                                                                                                                                                                                                                cursor: pointer; width: 70px;
                                                                                                                                                                                                                                                                                                            text-align: center; font-size: 12px;
                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                            .desktop-icon .icon-box {
                                                                                                                                                                                                                                                                                                                                        width: 50px; height: 50px;
                                                                                                                                                                                                                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                display: flex; justify-content: center; align-items: center;
                                                                                                                                                                                                                                                                                                                                                                            font-size: 24px; margin-bottom: 5px;
                                                                                                                                                                                                                                                                                                                                                                                        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                        /* --- WINDOWS --- */
                                                                                                                                                                                                                                                                                                                                                                                                                .window {
                                                                                                                                                                                                                                                                                                                                                                                                                            position: absolute; 
                                                                                                                                                                                                                                                                                                                                                                                                                                        background-color: #ffffff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 10px; width: 280px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            overflow: hidden; display: none; flex-direction: column;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .title-bar {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        background-color: #e0e0e0; padding: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    display: flex; justify-content: space-between; align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-size: 14px; font-weight: bold; color: #333;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            cursor: grab; touch-action: none; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .close-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        background: #ff5f56; color: white; border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 50%; width: 20px; height: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                cursor: pointer; font-weight: bold; display: flex; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            justify-content: center; align-items: center; padding: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .window-content { padding: 20px; }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    /* --- APP SPECIFIC STYLES --- */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            textarea {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        width: 100%; height: 150px; border: none; outline: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resize: none; font-family: inherit; font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                padding: 10px; box-sizing: border-box; background-color: #f9f9f9;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .theme-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            display: block; width: 100%; padding: 10px; margin-bottom: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        h1 { margin-top: 0; font-size: 20px; color: #333; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                p { font-size: 14px; color: #555; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- TOP BAR -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="top-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div>My WebOS</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="clock">Loading...</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- DESKTOP ICONS -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="desktop-icon" id="welcome-icon" style="top: 60px; left: 20px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="icon-box" style="background-color: #4CAF50;">👋</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span>Welcome</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="desktop-icon" id="notes-icon" style="top: 60px; left: 110px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="icon-box" style="background-color: #2196F3;">📝</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span>Notes</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- THIS IS YOUR NEW FEATURE APP -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="desktop-icon" id="theme-icon" style="top: 60px; left: 200px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="icon-box" style="background-color: #9C27B0;">🎨</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span>Themes</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- WINDOWS -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Welcome Window -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="window" id="welcome-window" style="top: 150px; left: 20px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="title-bar" id="welcome-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span>Welcome.app</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="close-btn" onclick="toggleWindow('welcome-window', false)">×</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="window-content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h1>Welcome to My WebOS</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Drag me by the grey bar. Try opening the other apps!</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Notes Window -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="window" id="notes-window" style="top: 180px; left: 40px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="title-bar" id="notes-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span>Notes.app</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="close-btn" onclick="toggleWindow('notes-window', false)">×</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="window-content" style="padding: 0;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <textarea id="my-notes" placeholder="Type your notes here..."></textarea>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Theme Switcher Window (The New Feature) -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="window" id="theme-window" style="top: 210px; left: 60px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="title-bar" id="theme-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span>Themes.app</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="close-btn" onclick="toggleWindow('theme-window', false)">×</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="window-content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h1>Change Theme</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button class="theme-btn" style="background-color: #2b2b2b; color: white;" onclick="document.body.style.backgroundColor='#2b2b2b'">Dark Mode</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="theme-btn" style="background-color: #e0e0e0; color: black;" onclick="document.body.style.backgroundColor='#e0e0e0'">Light Mode</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="theme-btn" style="background-color: #1e3a8a; color: white;" onclick="document.body.style.backgroundColor='#1e3a8a'">Ocean Blue</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
